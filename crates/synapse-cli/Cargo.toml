[package]
name = "synapse-cli"
version.workspace = true
edition = "2024"
rust-version = "1.88"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "The `synapse` command line: a plain adapter for any agent or person (M2: identity)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/synapse"

[[bin]]
name = "synapse"
path = "src/main.rs"

[dependencies]
synapse = { path = "../..", version = "5.2.0" }
clap = { version = "4.5.41", features = ["derive"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3.0"
