[package]
name = "synapse-mcp"
version.workspace = true
edition = "2024"
rust-version = "1.88"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "MCP stdio adapter for Synapse: lets any MCP client send, poll, list and ack."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/synapse"

[lib]
name = "synapse_mcp"
path = "src/lib.rs"

[[bin]]
name = "synapse-mcp"
path = "src/main.rs"

[dependencies]
synapse = { path = "../..", version = "5.4.0" }
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
toml = "0.9.2"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "sync", "io-std", "io-util", "time"] }
tracing-subscriber = "0.3"

[dev-dependencies]
rmcp = { version = "3.4.0", features = ["client", "transport-child-process"] }
tokio = { version = "1.46.1", features = ["process"] }
tempfile = "3.0"
