[package]
name = "synapse-claude-channel"
version.workspace = true
edition = "2024"
rust-version = "1.89"
authors = ["Eric Evans <ciresnave@gmail.com>"]
description = "Claude Code channel adapter over synapsed: pushes mailbox messages into a Claude Code session as untrusted channel notifications."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/synapse"

[lib]
name = "synapse_claude_channel"
path = "src/lib.rs"

[[bin]]
name = "synapse-claude-channel"
path = "src/main.rs"

[dependencies]
synapse = { path = "../..", version = "6.0.0-rc.29" }
synapse-mcp-server = { path = "../synapse-mcp-server", version = "6.0.0-rc.29" }
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-io"] }
serde_json = "1.0"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "sync", "io-std", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
rmcp = { version = "3.4.0", features = ["client"] }
synapse-client = { path = "../synapse-client", version = "6.0.0-rc.29" }
tempfile = "3.0"
base64 = "0.22"
