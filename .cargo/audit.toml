# cargo-audit configuration. `cargo audit` reads this file from the project root.
#
# Every ignore here must say why it is safe, which dependency path it covers, and when it
# should be revisited. cargo-audit can only ignore by advisory ID, not by path, so the
# path is recorded in the comment and must be re-checked with
# `cargo tree --workspace --all-features -i <crate>` whenever this file is touched.

[advisories]
# RUSTSEC-2023-0071 (rsa, no fix) was ignored here while jsonwebtoken's `rust_crypto` backend pulled
# `rsa`. jsonwebtoken now uses `aws_lc_rs` (already in the tree via rustls, the board-104 tracked
# non-Rust exception), so `cargo tree --workspace -i rsa` is empty and the ignore is gone.
ignore = []
